[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memlite"
version = "0.1.0"
description = "Lean single-file SQLite + sqlite-vec semantic memory for AI agents (mem0 design, no Qdrant)."
requires-python = ">=3.10"
dependencies = [
    "sqlite-vec>=0.1.6",
    "openai>=1.0",
]

[tool.setuptools.packages.find]
include = ["memlite*"]
